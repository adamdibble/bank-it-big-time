<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank It! Big Time!</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#14213d;--muted:#6b7280;--line:#e5e7eb;--card:#f8fafc;--accent:#0f9d58;--accent2:#0b7a44;--warn:#d93025;--gold:#f4b400;--surface:#ffffff;}
body.dark{--bg:#0f1115;--ink:#e8eaed;--muted:#9aa0a6;--line:#2e333b;--card:#1a1d23;--surface:#16191e;--accent:#1e9e5a;--accent2:#5cd394;--warn:#f28b82;}
body.dark .pill.safe{background:#123222;border-color:#1f5a3a}
body.dark .pill.danger{background:#3a1715;border-color:#6b2a25}
body.dark .num.seven{border-color:#6b2a25}
body.dark .num.seven.safe7{border-color:#1f5a3a}
body.dark .slider{background:#3c4043}
body.dark .dblbtn{border-color:#8ab4f8;color:#8ab4f8}
body.dark .bh.lead{color:#fdd663}
body.dark .fx{box-shadow:0 18px 50px #000a}
body{transition:background .2s,color .2s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
 padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 20px);max-width:560px;margin-inline:auto}
h1{font-size:28px;font-weight:800;margin:4px 0 2px;letter-spacing:-.5px}
h2{font-size:16px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 8px;font-size:14px}
button{font:inherit;cursor:pointer;border:none;border-radius:12px}
.btn{border-radius:12px;background:var(--accent);color:#fff;font-weight:700;padding:14px 18px;font-size:17px;width:100%}
.btn:active{background:var(--accent2)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
input[type=text]{flex:1;font:inherit;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px}
.plist{list-style:none;padding:0;margin:8px 0}
.plist li{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.x{background:none;color:var(--warn);font-size:20px;padding:0 6px}
.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line)}
.rule .t{font-weight:600}.rule .d{font-size:13px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:30px;transition:.2s}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0003}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.colhead{background:none;padding:0;margin:22px 0 8px;text-align:left;color:inherit;border-radius:0;display:block}
.top .colhead{margin:0}
.grp{margin-left:6px;padding-left:8px;border-left:2px solid var(--line);margin-top:10px}
.colhead.sub{flex:1;min-width:0}
.colhead.sub h2{font-size:13px;color:var(--ink);white-space:normal;line-height:1.3}
.grp .top{gap:6px}
.grp .top .row{flex:none}
.grp [data-grp]{padding:6px 10px;font-size:13px}
.colhead h2{white-space:nowrap;font-size:15px}
[data-all]{white-space:nowrap}
.icoplay{background:none;border:none;padding:0 4px 0 0;font-size:inherit;line-height:1;cursor:pointer;border-radius:6px}
.icoplay:active,.icoplay.playing{animation:icobounce .45s}
@keyframes icobounce{30%{transform:scale(1.35)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-width:48px;height:36px;background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;border-radius:0;border-left:1px solid var(--line)}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:#fff}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:34px;height:34px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.hidden{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.pill.safe{background:#e6f4ea;border-color:#b7dfc4;color:var(--accent2)}
.pill.danger{background:#fdecea;border-color:#f5c2bd;color:var(--warn)}
.bankbox{text-align:center;margin:14px 0 6px;padding:18px 10px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bankbox .lbl{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bankbox .amt{font-size:64px;font-weight:800;letter-spacing:-2px;line-height:1.05}
.bankbox .amt.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.msg{min-height:22px;text-align:center;font-weight:600;margin:6px 0 10px}
.roller{text-align:center;font-size:15px;color:var(--muted);margin-bottom:8px}
.roller b{color:var(--ink)}
.dice{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.num{height:60px;background:var(--surface);border:2px solid var(--line);border-radius:14px;font-size:26px;font-weight:800;color:var(--ink)}
.num:active{background:var(--card)}
.num.seven{border-color:#f5c2bd;color:var(--warn)}
.num.seven.safe7{border-color:#b7dfc4;color:var(--accent2)}
.num:disabled{opacity:.25}
.dblbtn{height:60px;border-radius:14px;font-size:16px;font-weight:800;background:var(--surface);border:2px solid #1a73e8;color:#1a73e8}
.dblbtn.on{background:#1a73e8;color:#fff}
.picked{text-align:center;color:var(--muted);font-size:14px;margin:8px 0}
.players{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pcard{color:var(--ink);padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.pcard .n{font-weight:700;font-size:15px;display:flex;justify-content:space-between}
.pcard .s{font-size:22px;font-weight:800;margin-top:2px}
.pcard .bh{font-size:13px;font-weight:700;color:var(--warn);margin-top:1px}
.pcard .bh.lead{color:#b07d00}
.pcard .a{font-size:12px;color:var(--muted);margin-top:4px}
.pcard.turn{border-color:var(--gold);box-shadow:0 0 0 2px #f4b40055}
.pcard.banked{background:var(--card);opacity:.65}
.pcard:not(.banked) .a{color:var(--accent2);font-weight:700}
.bar{display:flex;gap:8px;margin-top:14px}
.overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.log{font-size:13px;color:var(--muted);margin-top:16px;max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.log div{padding:2px 0}
table{width:100%;border-collapse:collapse;margin-top:10px}
td{padding:10px 6px;border-bottom:1px solid var(--line);font-size:17px}
td:last-child{text-align:right;font-weight:800}
.help h3{margin:18px 0 6px;font-size:17px}
.help p,.help li{font-size:15px;line-height:1.45}
.help ul{padding-left:20px;margin:6px 0}
.help .off{opacity:.5}
.sumcard{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.sumcard h3{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sumcard div{padding:4px 0;font-size:15px}
.trophy{font-size:56px;text-align:center}
.fx{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 18%);transform:translate(-50%,0) scale(.6);opacity:0;z-index:9;
 width:min(86vw,420px);text-align:center;padding:22px 16px;border-radius:22px;background:var(--surface);border:3px solid var(--c,#0f9d58);
 box-shadow:0 18px 50px #0004;pointer-events:none;transition:transform .22s cubic-bezier(.2,1.6,.4,1),opacity .18s}
.fx.show{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.fx .e{font-size:64px;line-height:1}
.fx .t{font-size:28px;font-weight:800;margin-top:6px;color:var(--c,#0f9d58);letter-spacing:-.5px}
.fx .u{font-size:16px;color:var(--muted);margin-top:4px;font-weight:600}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head>
<body>

<!-- SETUP -->
<section id="setup">
  <h1>Bank It! Big Time! 💰</h1>
  <p class="sub">Scorekeeper for real dice · <button type="button" id="howLink" onclick="showHelp()" style="background:none;padding:0;color:var(--accent2);font-weight:700;text-decoration:underline;font-size:inherit;border-radius:0">How to play</button></p>
  <div id="resumeWrap" class="hidden" style="margin:10px 0 4px"><button class="btn" id="resumeBtn">▶ Resume game</button>
    <p class="sub" style="text-align:center;margin-top:6px">Players are locked while a game is in progress.</p></div>

  <h2>Players</h2>
  <form class="row" id="addForm">
    <input type="text" id="pname" placeholder="Add player name" maxlength="16" autocomplete="off">
    <button class="btn small" type="submit">Add</button>
  </form>
  <ul class="plist" id="plist"></ul>

  <h2>Game</h2>
  <div id="gameOpts"></div>

  <div id="ruleOpts"></div>

  <div style="margin-top:20px"><button class="btn" id="startBtn">Start game</button></div>
  <p class="sub" style="text-align:center;margin-top:14px;font-size:12px">Version 5.9</p>
</section>

<!-- GAME -->
<section id="game" class="hidden">
  <div class="top">
    <span class="pill" id="roundPill">Round 1/20</span>
    <span class="pill safe" id="phasePill">Safe roll 1/3</span>
    <span class="row"><button class="btn ghost small" id="darkBtn" aria-label="Dark mode">🌙</button><button class="btn ghost small" id="homeBtn" aria-label="Home">🏠</button><button class="btn ghost small" id="menuBtn">⚙︎</button></span>
  </div>

  <div class="bankbox"><div class="lbl">Bank</div><div class="amt" id="bankAmt">0</div></div>
  <div class="msg" id="msg"></div>
  <div class="roller" id="roller"></div>

  <div class="dice" id="dice"></div>
  <div class="picked" id="picked">Tap the total you rolled</div>

  <h2 style="margin-top:12px">Tap a player to bank</h2>
  <div class="players" id="pcards"></div>

  <div class="bar">
    <button class="btn ghost" id="undoBtn">↶ Undo</button>
    <button class="btn ghost" id="scoresBtn">Scores</button>
  </div>
  <div class="log" id="log"></div>
</section>

<!-- END -->
<section id="end" class="hidden">
  <div class="trophy">🏆</div>
  <h1 style="text-align:center" id="winner"></h1>
  <table id="finalTable"></table>
  <div id="summary"></div>
  <div class="bar">
    <button class="btn" id="copySum">📋 Copy recap</button>
    <a class="btn" id="smsSum" style="text-align:center;text-decoration:none;display:block">💬 Text it</a>
  </div>
  <textarea id="sumText" readonly class="hidden" style="width:100%;height:180px;margin-top:8px;font:13px/1.4 Inter,sans-serif;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink)"></textarea>
  <div class="bar" style="flex-direction:column">
    <button class="btn" id="againBtn">▶ Play again (same players &amp; rules)</button>
    <button class="btn ghost" id="newBtn">⚙︎ Change rules or players</button>
  </div>
</section>

<!-- Sheet -->
<div class="fx" id="fx"><div class="e" id="fxE"></div><div class="t" id="fxT"></div><div class="u" id="fxU"></div></div>
<div class="overlay hidden" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
const RULES = [
  {k:'seven70', std:true, t:'Opening 7 = 70', d:'A 7 during the safe rolls adds 70 instead of 7.', type:'bool', def:true},
  {k:'doublesDouble', std:true, t:'Doubles double the bank', d:'After the safe rolls, doubles double the bank.', type:'bool', def:true},
  {k:'stackDoubles', t:'Stacking doubles', d:'Back-to-back doubles escalate: the first doubles ×2, and the next doubles in a row ×4. ×4 is the cap, so a third (or more) in a row is still ×4. Any non-doubles roll resets the stack.', type:'bool', def:true},
  {k:'matchRoll', t:'Copycat roll', d:'If you roll the same total as the player before you, your roll counts double (e.g., 8 then 8 adds 16).', type:'bool', def:true},
  {k:'straight', t:'Straight = +1000 to bank', d:'If the table’s last 4 rolls in a round (any players, any order) are 4 numbers in a row, like 3-4-5-6, 1,000 points go into the bank.', type:'bool', def:true},
  {k:'finalDouble', t:'Final round frenzy', d:'In the last round, banking pays double the bank.', type:'bool', def:true},
  {k:'bustCurse', t:'Triple bust curse', d:'If the same player rolls the busting 7 that ends three rounds in a row, their score drops to 0. A round that ends with everyone banking breaks the streak.', type:'bool', def:true},
  {k:'hatTrick', t:'Doubles hat trick', d:'Roll doubles on three of your own turns in a row within one round and you get +500 straight to your score, not the bank. Safe-roll doubles don’t count, and the count resets every round.', type:'bool', def:true},
  {k:'happyHour', t:'Happy hour (round 5)', d:'In round 5, every roll’s points count double, including Lucky 7s (140).', type:'bool', def:true},
  {k:'ocean11', t:'Ocean’s 11 (round 11)', d:'In round 11, an 11 adds 1,100 to the bank instead of 11. Robin Hood still triggers too.', type:'bool', def:true},
  {k:'suddenDeath', t:'Sudden death', d:'If the top two players finish within 100 points of each other, they play one bonus round, just the two of them, to decide the winner. Everyone else sits out. Still exactly tied? Another bonus round.', type:'bool', def:true},
  {k:'loserBaby', t:'I’m a loser, baby', d:'Roll 10 busting 7s in one game and you’re disqualified on the spot. Your points are split equally among the remaining players, and you sit out the rest of the game.', type:'bool', def:true},
  {k:'pennyPincher', t:'Penny pincher', d:'Be the first player to bank in a round 5 times and your points are split equally among the other players. You’re left with 1 point, and your count starts over.', type:'bool', def:true},
  {k:'devil', t:'The devil’s number', d:'If three non-double 6s are rolled in a row in a round (by anyone), every player who hasn’t banked yet loses all their points and the round ends. Just tap 6; a Doubles roll breaks the streak.', type:'bool', def:true},
  {k:'pirate', t:'Pirate’s booty', d:'If three non-double 8s are rolled in a row in a round (by anyone), whoever rolled the third one steals 10% of every other player’s score. Just tap 8; a Doubles roll breaks the streak.', type:'bool', def:true},
  {k:'reverse', t:'Reverse', d:'Rolling a 3 flips the direction of play, like an UNO reverse card. It stays that way until someone rolls another 3. Best with 3 or more players.', type:'bool', def:true},
  {k:'tresLeches', t:'Tres leches', d:'If three 3s are rolled in a row in a round (by anyone), whoever rolled the third one has their score revalued as if it were Mexican pesos instead of US dollars, at the current exchange rate. Their score shrinks to about 1/18th.', type:'bool', def:true},
  {k:'sixSeven', t:'6-7!', d:'After the safe rolls, if one player rolls a 6 and the very next roll, by someone else, is a 7, the round doesn’t bust. The bank doubles instead and play goes on.', type:'bool', def:true},
  {k:'sevenEleven', t:'7-Eleven', d:'A 7 during the safe rolls followed right away by an 11 (any players) adds 711 to the bank.', type:'bool', def:true},
  {k:'blackjack', t:'Blackjack', d:'Two back-to-back rolls in a round that add up to 21 (10 + 11 or 9 + 12, in either order) give whoever rolled the second one +210 to their score.', type:'bool', def:true},
  {k:'nineToFive', t:'9 to 5', d:'A 9 followed right away by a 5 gives everyone who hasn’t banked yet +95 to their score.', type:'bool', def:true},
  {k:'deuces', t:'Deuces Wild (Marzi’s Madness)', d:'If anyone rolls a 2 during the safe rolls, everyone’s scores are randomly shuffled. You might even get your own back. 💩', type:'bool', def:true},
  {k:'district12', t:'District 12', d:'Roll a 12 during the safe rolls and it’s the Reaping: everyone who hasn’t banked yet rolls once more, and the lowest roll is out for the rest of the round. Tied for lowest? Those players roll off until one is lowest.', type:'bool', def:true},
  {k:'robinHood', t:'Robin Hood', d:'Rolling an 11 moves 100 points from the leader’s score to the player in last place.', type:'bool', def:true},
  {k:'lastChicken', t:'Last chicken', d:'If you’re the last player still in the round and you bank before the 7, you get +150 to your score for your nerve. Somebody else has to have been in the round with you.', type:'bool', def:true},
  {k:'mercy', t:'Mercy rule', d:'At the end of round 10, anyone with less than half the leader’s score is out of the game. Their score freezes and they can’t win. Only matters in 15- and 20-round games.', type:'bool', def:true},
  {k:'emergency911', t:'What’s your emergency? (911)', d:'Roll the dice that makes the bank exactly 911 and you’re rushed out for the rest of the round. You also pay up to 1,000 points in medical bills (your score can’t go below 0). You’re back in next round.', type:'bool', def:true},
  {k:'hell666', t:'Go to hell (666)', d:'Roll the dice that makes the bank exactly 666 and you go to hell. Your score drops to 0 (you can’t take it with you) and you’re out of the game.', type:'bool', def:true},
  {k:'heaven777', t:'Go to heaven (777)', d:'Roll the dice that makes the bank exactly 777 and you go to heaven: you win the game on the spot, no matter what the scores are.', type:'bool', def:true},
  {k:'high420', t:'Too high to play (420)', d:'Roll the dice that makes the bank exactly 420 and you’re too high to play: you’re out for the rest of this round and the next two rounds.', type:'bool', def:true},
  {k:'notFound404', t:'Not Found (404)', d:'Roll the dice that makes the bank exactly 404 and you can’t be found: you skip your next turn.', type:'bool', def:true},
  {k:'y2k', t:'Y2K (2,000)', d:'If a roll makes the bank exactly 2,000, the bank glitches and resets to a random amount between 0 and 4,000.', type:'bool', def:true},
  {k:'leet1337', t:'Leet (1,337)', d:'Roll the dice that makes the bank exactly 1,337 and you get +1,337 to your score for your elite skills.', type:'bool', def:true},
  {k:'war1812', t:'War of 1812 (1,812)', d:'Roll the dice that makes the bank exactly 1,812 and you go to war with the leader (or the next-highest player, if you’re the leader). You each roll; the higher roll takes up to 1,812 points from the other. Ties roll again.', type:'bool', def:true},
  {k:'odyssey2001', t:'A Space Odyssey (2,001)', d:'If a roll makes the bank exactly 2,001, the computer takes over: nobody can bank for the next two rolls.', type:'bool', def:true},
  {k:'vanHalen5150', t:'Van Halen (5,150)', d:'Roll the dice that makes the bank exactly 5,150 and you jump straight to the top: your score becomes 1 point more than the leader’s. Already in the lead? You get +5,150 instead.', type:'bool', def:true},
  {k:'tradingPlaces', t:'Trading Places', d:'If the player in last place rolls a 9, they swap scores with the leader.', type:'bool', def:true},
  {k:'musicalChairs', t:'Musical Chairs', d:'If three 10s are rolled in a row in a round (by anyone), every score passes one seat over in the current direction of play: everyone gets their neighbor’s score. Just tap 10; a Doubles roll breaks the streak.', type:'bool', def:true},
  {k:'shareWealth', t:'Share the Wealth', d:'If three 9s are rolled in a row in a round (by anyone), everyone’s scores are averaged: the whole table resets to the same number.', type:'bool', def:true},
  {k:'duel', t:'Duel', d:'From round 4 on, if the player in last place rolls the busting 7, they can challenge the leader to a duel (or pass). One roll each; a tie goes to the leader. If the challenger wins, they take 10% of the leader’s score. If the leader wins, the challenger sits out the next round.', type:'bool', def:true},
  {k:'modem56', t:'56K Modem (56)', d:'Roll the dice that makes the bank exactly 56 and you connect at 56K: +560 downloads into the bank.', type:'bool', def:true},
  {k:'alert1000', t:'Emergency Alert (1,000)', d:'If a roll makes the bank exactly 1,000, everyone still in the round must evacuate: they all bank the 1,000 immediately and the round ends.', type:'bool', def:true},
  {k:'nokia3310', t:'Nokia 3310 (3,310)', d:'Roll the dice that makes the bank exactly 3,310 and you’re indestructible for the rest of the round: if the round busts while you’re still in, you bank the pot anyway.', type:'bool', def:true},
  {k:'fateKnocks', t:'Fate Knocks', d:'Three 5s in a row (by anyone) is the “da-da-da” — the next roll is the “DUM.” If it’s a 7, everyone still in the round loses half their score (and after the safe rolls, the round busts too). Anything else, and the bank doubles.', type:'bool', def:true},
  {k:'mountainKing', t:'Hall of the Mountain King', d:'Four table rolls in a row, each higher than the one before (like 4 → 6 → 9 → 11), double the bank.', type:'bool', def:true},
  {k:'hallelujah', t:'Hallelujah!', d:'A round that reaches 20 rolls without a bust is a miracle: the bank doubles on the 20th roll.', type:'bool', def:true},
  {k:'no7Bonus', t:'Seven-free bonus', d:'Any player who goes the whole game without rolling a 7 gets +777 at the end.', type:'bool', def:true},
  {k:'jackpot7', t:'Triple 7 jackpot', d:'If the first three (safe) rolls of a round are all 7s, the bank jumps to 7,000.', type:'bool', def:true},
];
// USD -> MXN rate for Tres leches: live when the page is allowed to fetch it, otherwise the last known rate
let MXN={rate:17.5, live:false, when:'approximate rate'};
try{ const c=JSON.parse(localStorage.getItem('bankMXN')||'null'); if(c&&c.rate>5&&c.rate<50) MXN={rate:c.rate,live:false,when:'rate from '+c.date}; }catch(e){}
(async()=>{ try{
  const ctl=new AbortController(); setTimeout(()=>ctl.abort(),5000);

    sndEl.dataset.url=url; sndEl.src=url; sndEl.volume=1;
    const pr=sndEl.play(); if(pr&&pr.catch) pr.catch(()=>{});
  }catch(e){}
}
function tone(seq,start){ playSeqs([[seq,start||0]]); }
const FX_MS=1500;
function flushFX(){
  recordFX();
  if(!FXQ.length) return;
  const q=FXQ; FXQ=[];
  // each banner waits for the previous one's tone to finish (at least FX_MS apart)
  let t=0; const at=q.map(x=>{ const s0=t; const len=FXDEF[x.kind].tone.reduce((a,[,d])=>a+d,0)*1000; t+=Math.max(FX_MS,len+150); return s0; });
  playSeqs(q.map((x,k)=>[FXDEF[x.kind].tone, at[k]/1000, FXDEF[x.kind].vol||1])); // one clip, started inside the tap
  q.forEach((x,k)=>setTimeout(()=>showFX(x,Math.max(FX_MS,FXDEF[x.kind].tone.reduce((a,[,d])=>a+d,0)*1000)), at[k]));
}
function showFX(x,dur){
  const d=FXDEF[x.kind], el=$('fx');
  el.style.setProperty('--c',d.c);
  $('fxE').textContent=d.e; $('fxT').textContent=x.title; $('fxU').textContent=x.sub||'';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  if(['bust','wipe','out'].includes(x.kind)){ document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake'); }
  try{ if(navigator.vibrate) navigator.vibrate(x.kind==='bust'||x.kind==='out'?[80,40,80]:30); }catch(e){}
  clearTimeout(showFX.t); showFX.t=setTimeout(()=>el.classList.remove('show'), (dur||FX_MS)-150);
}
$('fx').onclick=()=>$('fx').classList.remove('show');

   .forEach(([k,t])=>ev(k,t,'Sound test',-1));
  flushFX(); S.settings.sound=was;
}

function showHelp(){
  const st=S.settings, sp=RULES.filter(r=>!r.std);
  const on=sp.filter(r=>st[r.k]), off=sp.filter(r=>!st[r.k]);
  const li=r=>`<li><b>${ttl(r)}</b> — ${r.d}</li>`;
  openSheet(`<div class="help">
    <div class="top"><h2 style="margin:0">How to play</h2><button class="btn ghost small" id="closeH">Done</button></div>
    <h3>🎯 The goal</h3>
    <p>Have the most points after ${st.rounds} rounds. Everyone shares one bank each round, and the trick is knowing when to take it.</p>
    <h3>🎲 A round</h3>
    <ul>
      <li>Players take turns rolling two dice. Every roll adds to the shared <b>bank</b>.</li>
      <li>The first <b>${st.safe} rolls are safe</b>: a 7 can’t hurt you${st.seven70?' — it adds 70 instead':''}.</li>
      <li>After the safe rolls, <b>a 7 busts the round</b>: anyone who hasn’t banked gets nothing.</li>
      ${st.doublesDouble?'<li>After the safe rolls, <b>doubles double the bank</b>.</li>':''}
      <li>Any time between rolls, a player can <b>bank</b>: take the current bank as points and sit out the rest of the round.</li>
      <li>The round ends on a bust or when everyone has banked. After a bust, the next player in line starts the next round.</li>
    </ul>
    <h3>📱 Using the app</h3>
    <ul>
      <li>Roll real dice, then tap the <b>total</b>. After the safe rolls you can just tap <b>Doubles ×2</b> for any doubles.</li>
      <li>To bank, tap the player’s card.</li>
      <li><b>↶ Undo</b> reverses the last roll or bank. <b>🏠</b> pauses the game; Resume brings you back.</li>
      <li>Settings lock once the game starts, so agree on rules first.</li>
    </ul>
    <h3>✨ Special rules in play (${on.length})</h3>
    ${on.length?groupedSpecial().map(gp=>{ const rs=gp.rules.filter(r=>st[r.k]); return rs.length?`<p style="margin:12px 0 2px;font-weight:700">${gp.t}</p><ul>${rs.map(li).join('')}</ul>`:''; }).join(''):'<p>None — classic Bank.</p>'}
    ${off.length?`<h3 class="off">Turned off</h3><ul class="off">${off.map(li).join('')}</ul>`:''}
    
  </div>`, ()=>{ $('closeH').onclick=()=>{ closeSheet(); try{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); }catch(e){} }; });
}
// open the guide in place, without navigating (embeds like Google Sites can send '#' links to the parent page)

function checkHash(){ if(location.hash==='#how-to-play') showHelp(); }
window.addEventListener('hashchange',checkHash);

/* ---------- sheets ---------- */
function openSheet(html,bind){ $('sheet').innerHTML=html; $('overlay').classList.remove('hidden'); bind&&bind(); }
function closeSheet(){ $('overlay').classList.add('hidden'); }
$('overlay').onclick=e=>{ if(e.target.id==='overlay' && !(S.g&&(S.g.reap||S.g.war||S.g.duel||(S.g.notices&&S.g.notices.length)))) closeSheet(); };
$('menuBtn').onclick=showMenu;
function showMenu(){
  openSheet(`<div class="top"><h2 style="margin:0">Settings</h2><button class="btn ghost small" id="closeS">Done</button></div>
    ${GAME_OPTS.map(optHTML).join('')}${rulesHTML()}
    <div class="bar"><button class="btn ghost" id="helpBtn">📖 How to play</button><button class="btn ghost" id="testSnd">🔊 Test sounds</button></div>
    <div class="bar"><button class="btn ghost" id="quitBtn" style="color:var(--warn)">End game & go to setup</button></div>`,
    ()=>{ bindOpts($('sheet'), showMenu); $('closeS').onclick=()=>{closeSheet();renderGame();};
      $('testSnd').onclick=()=>{ closeSheet(); testSounds(); };
      $('helpBtn').onclick=()=>showHelp();
      $('quitBtn').onclick=()=>{ $('quitBtn').textContent='Tap again to confirm'; $('quitBtn').onclick=()=>{S.screen='setup';S.g=null;S.settings.rounds=15;save();closeSheet();render();}; }; });
}
$('scoresBtn').onclick=()=>openSheet(`<div class="top"><h2 style="margin:0">Standings</h2><button class="btn ghost small" id="closeS">Done</button></div><table>${standings()}</table>`,
  ()=>$('closeS').onclick=closeSheet);
function standings(){
  const el=S.g.elim||[], mc=S.g.mercy||[], hl=S.g.hell||[], hv=S.g.heaven;
  return S.names.map((nm,i)=>({nm,s:S.g.scores[i],x:el.includes(i),m:mc.includes(i),h:hl.includes(i),v:i===hv})).sort((a,b)=>(b.v-a.v)||(a.x-b.x)||(b.s-a.s))
    .map((p,k,arr)=>p.v?`<tr><td>😇 ${esc(p.nm)} <span style="font-size:13px">(went to heaven)</span></td><td>${p.s.toLocaleString()}</td></tr>`:p.h?`<tr style="opacity:.5"><td>👹 ${esc(p.nm)} <span style="font-size:13px">(went to hell)</span></td><td>0</td></tr>`:p.m?`<tr style="opacity:.5"><td>🏳️ ${esc(p.nm)} <span style="font-size:13px">(out — mercy rule)</span></td><td>${p.s.toLocaleString()}</td></tr>`:p.x?`<tr style="opacity:.5"><td>🗑️ ${esc(p.nm)} <span style="font-size:13px">(disqualified)</span></td><td>DQ</td></tr>`:`<tr><td>${k+1}. ${esc(p.nm)}${k&&arr[0].s>p.s&&hv==null?` <span style="color:var(--warn);font-size:13px">(${(arr[0].s-p.s).toLocaleString()} behind)</span>`:''}</td><td>${p.s.toLocaleString()}</td></tr>`).join('');
}

/* ---------- end ---------- */
const PLAY_URL='https://bank.adamdibble.com/';
function buildSummary(){
  recordFX();
  const g=S.g, T=stats(), N=S.names, fmt=x=>Math.round(x).toLocaleString();
  const top=(f,minv=1)=>{ const v=N.map((_,i)=>f(i)); const m=Math.max(...v); if(!(m>=minv)) return null; return {who:N.filter((_,i)=>v[i]===m).join(' & '),v:m}; };
  const low=(f,ok)=>{ const ids=N.map((_,i)=>i).filter(ok); if(ids.length<2) return null; const m=Math.min(...ids.map(f)); return {who:ids.filter(i=>f(i)===m).map(i=>N[i]).join(' & '),v:m}; };
  const avg=i=>T.p[i].banks?T.p[i].bankSum/T.p[i].banks:0;
  const awards=[];
  let a;
  if(a=top(i=>T.p[i].big)) awards.push(`🏦 Biggest bank: ${a.who} (${fmt(a.v)})`);
  const dare=top(i=>avg(i));
  if(dare) awards.push(`🤑 Daredevil: ${dare.who} (avg bank ${fmt(dare.v)})`);
  const safe=low(avg,i=>T.p[i].banks>0); if(safe && safe.who!==(dare&&dare.who)) awards.push(`🐔 Played it safe: ${safe.who} (avg bank ${fmt(safe.v)})`);
  if(a=top(i=>T.p[i].banks)) awards.push(`🎯 Most banks: ${a.who} (${a.v})`);
  if(a=top(i=>T.p[i].dbl)) awards.push(`🎲 Doubles machine: ${a.who} (${a.v} doubles)`);
  if(a=top(i=>T.p[i].sevens)) awards.push(`7️⃣ Seven magnet: ${a.who} (${a.v} sevens)`);
  if(a=top(i=>T.p[i].busts)) awards.push(`💥 Round wrecker: ${a.who} (${a.v} busts)`);
  if(a=top(i=>T.p[i].lost)) awards.push(`😭 Heartbreak: ${a.who} (${fmt(a.v)} lost to busts)`);
  const highlights=Object.entries(T.rules).sort((x,y)=>y[1].n-x[1].n).map(([k,r])=>{
    const by=Object.entries(r.by).sort((x,y)=>y[1]-x[1]).map(([i,c])=>`${N[i]}${c>1?' ×'+c:''}`).join(', ');
    return `${RULE_LABEL[k]||k}: ${r.n}${by?` (${by})`:''}`; });
  const facts=[`${g.round} rounds${g.sd?` + ${g.sdCount} sudden-death round${g.sdCount>1?'s':''}`:''}, ${T.totalRolls} rolls`, `Biggest pot: ${fmt(T.biggestPot)}`, `Longest round: ${T.longest} rolls`];
  const el=g.elim||[];
  const mc=g.mercy||[], hl=g.hell||[], hv=g.heaven;
  const order=N.map((nm,i)=>({nm,s:g.scores[i],x:el.includes(i),m:mc.includes(i),h:hl.includes(i),v:i===hv})).sort((x,y)=>(y.v-x.v)||(x.x-y.x)||(y.s-x.s));
  const text=[`🎲 Bank It! Big Time! — game recap`,
    `🏆 ${$('winner').textContent} (${fmt(order[0].s)})`, '',
    ...order.map((p,k)=>p.v?`😇 ${p.nm} — ${fmt(p.s)} (went to heaven: 777)`:p.h?`👹 ${p.nm} — went to hell (666)`:p.m?`🏳️ ${p.nm} — ${fmt(p.s)} (out, mercy rule)`:p.x?`🗑️ ${p.nm} — disqualified (10 busts)`:`${k+1}. ${p.nm} — ${fmt(p.s)}${k&&hv==null?` (${fmt(order[0].s-p.s)} behind)`:''}`), '',
    'AWARDS', ...awards, '',
    'FUN FACTS', ...facts, '', `Play it: ${PLAY_URL}`].join('\n');
  return {awards,highlights,facts,text};
}
function renderEnd(){
  const el=S.g.elim||[], live=S.names.map((_,i)=>i).filter(i=>!el.includes(i));
  const max=Math.max(...live.map(i=>S.g.scores[i]));
  const w=live.filter(i=>S.g.scores[i]===max).map(i=>S.names[i]);
  $('winner').textContent = S.g.heaven!=null ? `😇 ${S.names[S.g.heaven]} went to heaven and wins!` : w.length>1 ? `Tie: ${w.join(' & ')}` : `${w[0]} wins!`;
  $('finalTable').innerHTML=standings();
  const sm=buildSummary();
  const card=(h,arr)=>arr.length?`<div class="sumcard"><h3>${h}</h3>${arr.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:'';
  $('summary').innerHTML=card('Awards',sm.awards)+card('Fun facts',sm.facts);
  $('sumText').value=sm.text; $('sumText').classList.add('hidden');
  $('smsSum').href='sms:?&body='+encodeURIComponent(sm.text);
  $('copySum').textContent='📋 Copy recap';
  flushFX();
}
$('copySum').onclick=async()=>{
  try{ await navigator.clipboard.writeText($('sumText').value); $('copySum').textContent='✓ Copied — paste into a text'; }
  catch(e){ $('sumText').classList.remove('hidden'); $('sumText').select(); $('copySum').textContent='Select all & copy below'; }
};
$('againBtn').onclick=startGame;
$('newBtn').onclick=()=>{ S.screen='setup'; S.g=null; S.settings.rounds=15; S.ui=Object.assign(S.ui||{}, {sp:false}); save(); render(); try{window.scrollTo(0,0);}catch(e){} };

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function applyTheme(){ document.body.classList.toggle('dark', !!S.settings.dark); const b=$('darkBtn'); if(b) b.textContent=S.settings.dark?'☀️':'🌙'; }
function render(){
  applyTheme();
  ['setup','game','end'].forEach(id=>$(id).classList.toggle('hidden',S.screen!==id));
  if(S.screen==='setup') renderSetup();
  if(S.screen==='game'){ if(!S.g){S.screen='setup';return render();} renderGame(); }
  if(S.screen==='end') renderEnd();
}
render();
checkHash();
